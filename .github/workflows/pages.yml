name: Deploy Pages

# T2-3：檢查通過才部署。validate.py 失敗 → 不部署，真網站保持上一版。
# 順序注意（2026-11-18 修正）：必須先跑 build.py 產生 index.json，再跑 validate.py。
# 2026-11-24 修正（Claude）：部署間歇出現「No artifacts named "github-pages" were found」
#   （11-22、11-23、11-24 Gumroad 三次）。原因：打包與部署同一個 job，
#   deploy-pages 查 artifact 時 GitHub 未登記好。改為：
#   1. build 與 deploy 分開兩個 job（官方建議結構）；
#   2. deploy 失敗自動等候重試，最多 3 次；
#   3. verify：真站 version.json 的 sha 等於今次提交才算完成；
#   4. 任何一步失敗自動開 issue 指派 Gu（會收到 email）。
# 本檔須由 Gu 在 GitHub 網頁版貼上（Muse 的 GitHub App 沒有 Workflows 權限）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PsyPick index and version
        run: python3 tools/psypick/build.py --data-dir psypick/data --sha "${{ github.sha }}"

      - name: Validate PsyPick data
        run: python3 tools/validate.py --data-dir psypick/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.d1.outcome == 'failure'
        run: sleep 45

      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 120

      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 等真站 version.json 變成今次提交
        run: |
          for i in $(seq 1 20); do
            live=$(curl -fsS "https://clinicmind.github.io/psypick/data/version.json?t=$(date +%s)" | jq -r '.sha // empty' || true)
            echo "第 $i 次：live=$live want=$GITHUB_SHA"
            if [ "$live" = "$GITHUB_SHA" ]; then echo "已上線"; exit 0; fi
            sleep 30
          done
          echo "::error::10 分鐘內真站 version.json 未更新"
          exit 1

  notify:
    needs: [build, deploy, verify]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ PsyPick 部署失敗／未上線 ${context.sha.slice(0, 7)}`,
              body: [
                `提交：${context.sha}`,
                `Build／Validate：${{ needs.build.result }}`,
                `Deploy：${{ needs.deploy.result }}`,
                `Verify：${{ needs.verify.result }}`,
                ``,
                `執行紀錄：${run}`,
                ``,
                `Build 失敗 = 資料問題，Muse 修正後再推送。`,
                `Deploy／Verify 失敗 = GitHub 那邊的問題，看門狗會在 3 小時內自動重新部署。`,
              ].join("\n"),
              assignees: ["clinicmind"],
            });
